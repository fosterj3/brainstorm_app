# Ority on Render, free plan.
# Free web services sleep after ~15 minutes without traffic and have no persistent disk, so polls are
# forgotten when the service restarts. Fine for trying Ority and for a session you run in one sitting.
# For polls that must survive, use a paid plan with a disk (see README).
services:
  - type: web
    # Renaming a blueprint service makes Render create a NEW service (and a new URL). To keep the existing
    # one, rename it in the Render dashboard first. See README, Hosting.
    name: ority
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TRUST_PROXY
        value: "1"
      # Polls survive restarts because they are copied to a private bucket (set the four BACKUP_S3_* values
      # in the Render dashboard, never here). See docs/HOSTING.md. Without them, add DEMO_NOTICE=1 so every
      # page says polls can be erased.
