# Fly.io config. Change `app` to a unique name, then follow the README.
app = "ority-change-me"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/ority.db"
  TRUST_PROXY = "1"

[[mounts]]
  source = "ority_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Never stop or scale to zero: live sessions hold WebSockets and timers in memory.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
